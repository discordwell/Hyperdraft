# Hearthstone calibration corpus.
#
# Reference set: Stormrift (52 cards), the largest custom Hearthstone
# archetype showcase in the repo (Pyromancer + Cryomancer 30-card decks
# sharing a card pool). Stormrift was specifically designed for the
# Hearthstone engine — every card uses `battlecry`, `deathrattle`, or
# `spell_effect` callables — so it exercises the breadth of HS-specific
# AST patterns the scorer can see.
#
# Why Hearthstone's thresholds differ from MTG/Pokemon:
#   * median_depth is structurally lower (~1.0 vs 2.0+ for MTG) because
#     the depth rubric was built around MTG/Pokemon vocabulary. Many HS
#     mechanics (Combo, Overload, Quest, Discover, Secret) don't yet
#     have novel-helper entries that bump Synergy Hook to 3. Stormrift
#     cards cluster at 1-2 axes lit and the rubric reads that as
#     "functional, not spicy" — accurate to current scorer visibility.
#   * axis_diversity hovers near 0.10 (matches MTG floor) because the
#     deck-of-30 archetype showcase only spans a couple of axes.
#   * code_diversity is comfortably above MTG (~0.68) because each
#     Stormrift card was hand-written rather than auto-generated.
#   * thin_ratio is structurally high (~0.98). HS minions are mostly
#     stat-lines with a single keyword or Battlecry — the AST walker
#     reads them as "scored 0 on 3+ axes" because Battlecry triggers
#     don't read deep state.
#
# Gates were chosen so Stormrift passes all 4 honestly: it clears the
# relaxed median (1.0 ≥ 1), axis (0.096 ≥ 0.08), code (0.68 ≥ 0.50),
# and thin-ratio (0.981 ≤ 0.99) gates. The thin-ratio gate is the
# loosest because HS minions are mostly stat-lines — the AST walker
# reads them as "scored 0 on 3+ axes" because Battlecry triggers don't
# read deep state.

engine = "hearthstone"
reference_set = "stormrift"
reference_module = "src.cards.hearthstone.stormrift"
reference_registry = "STORMRIFT_CARDS"

[thresholds]
# Floor the rubric in HS-realistic territory: median 1, not 2;
# code_diversity 0.50 (Stormrift sits at 0.68);
# thin_ratio 0.99 (Stormrift sits at 0.98 — minions are stat-lines).
median_depth = 1
axis_diversity = 0.08
code_diversity = 0.50
thin_ratio = 0.99

[expected]
# Stormrift passes all 4 under these gates; the thin-ratio gate is
# loose because HS minions are mostly stat-lines that read 0/0/0/0/0
# on the AST walker even when battlecries do something useful.
gates_passing_min = 4
