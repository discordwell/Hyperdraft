services:
  hyperdraft:
    build: .
    init: true
    ports:
      # Bind to localhost; Caddy on the host reverse-proxies the public domain.
      # Port matches the systemd unit it replaces and what caddy.conf expects.
      - "127.0.0.1:8030:8030"
    environment:
      # Ultra-agent runner selection
      HYPERDRAFT_ULTRA_AGENT: "${HYPERDRAFT_ULTRA_AGENT:-claude}"
      HYPERDRAFT_ULTRA_MODEL: "${HYPERDRAFT_ULTRA_MODEL:-}"

      # Logging
      LOG_FILE_PATH: "${LOG_FILE_PATH:-/app/storage/logs/app.log}"
      LOG_MAX_BYTES: "${LOG_MAX_BYTES:-10485760}"
      LOG_BACKUP_COUNT: "${LOG_BACKUP_COUNT:-5}"

      # Feature semaphore caps (Phase 2-4) — see src/server/concurrency.py.
      HYPERDRAFT_ULTRA_MAX: "${HYPERDRAFT_ULTRA_MAX:-3}"
      HYPERDRAFT_REPAIR_MAX: "${HYPERDRAFT_REPAIR_MAX:-1}"
      HYPERDRAFT_TRAIN_MAX: "${HYPERDRAFT_TRAIN_MAX:-1}"

      # Shared secrets for internal endpoints (Phase 2.4 / 4.3).
      # Set in .env on the host; never bake into the image.
      HYPERDRAFT_INTERNAL_SECRET: "${HYPERDRAFT_INTERNAL_SECRET:-}"
      HYPERDRAFT_ADMIN_SECRET: "${HYPERDRAFT_ADMIN_SECRET:-}"

      # Note: Claude is only reached via the Claude Code CLI subprocess
      # (launch_ultra_agent.sh + auto_repair.py + admin /ultra-loop), which
      # authenticates from /root/.claude. No ANTHROPIC_API_KEY is plumbed in.

      # Auto-repair tunables (Phase 3). Defaults match the infer-takehome reference.
      REPAIR_ENABLED: "${REPAIR_ENABLED:-true}"
      REPAIR_MAX_WALL_SECONDS: "${REPAIR_MAX_WALL_SECONDS:-18000}"
      REPAIR_PER_TURN_TIMEOUT_SECONDS: "${REPAIR_PER_TURN_TIMEOUT_SECONDS:-900}"
      REPAIR_VERIFY_TIMEOUT_SECONDS: "${REPAIR_VERIFY_TIMEOUT_SECONDS:-90}"

      # Spectator demo. Default OFF; visitors flip it via POST
      # /api/spectate/start (single-shot — one match, auto-disables when
      # the match ends). The legacy HYPERDRAFT_SPECTATOR_ENABLED env var
      # is no longer respected — toggle state lives at
      # storage/spectator_state.json on the persistent volume.
      HYPERDRAFT_SPECTATOR_COOLDOWN: "${HYPERDRAFT_SPECTATOR_COOLDOWN:-30}"
      HYPERDRAFT_SPECTATOR_MAX_WALL_SECONDS: "${HYPERDRAFT_SPECTATOR_MAX_WALL_SECONDS:-5400}"

    volumes:
      # Persistent claude-code home (auth credentials, session state).
      # Populated once via ``docker cp ~/.claude/.credentials.json hyperdraft:/root/.claude/``
      # — see docs/ops/claude_credential_refresh.md (Phase 2.5).
      - hyperdraft-claude-home:/root/.claude

      # Per-feature artifact storage: ultra-agent logs, repair sessions,
      # training run outputs. Survives container rebuild so the host-side
      # repair watcher can pick up DONE files (Phase 3.4).
      - hyperdraft-storage:/app/storage

      # Card art and SCP art bind-mounted read-only from the host. Default
      # paths target the OVH production layout; override the env vars to point
      # at a local checkout when smoke-testing on a workstation.
      # Hydrate via ``make seed-art`` (one-time, idempotent).
      - ${HYPERDRAFT_CARD_ART_PATH:-/opt/hyperdraft/assets/card_art}:/app/assets/card_art:ro
      - ${HYPERDRAFT_SCP_ART_PATH:-/opt/hyperdraft/frontend/public/scp-art}:/app/frontend/dist/scp-art:ro

    restart: unless-stopped

volumes:
  hyperdraft-claude-home:
  hyperdraft-storage:
